name: deploy-website

# Only run this when the master branch changes
on:
  #push:
  #  branches:
  #  - main
  #schedule:
    # hourly run
    #- cron: '3 * * * *'
    # daily run
    #- cron: '3 7 * * *'
    # weekly run
    #- cron: '3 7 * * 1'
  workflow_dispatch:
   inputs:
      refresh_website:
        type: boolean
        description: 'Refresh the website'
        default: true

# This job installs dependencies, builds the book, and pushes it to `gh-pages`


permissions:
  contents: read
  pages: write
  id-token: write


# Because we want to keep the website immutable, we have created a static ZIP of the main website, as previously deployed.
# It can be generated using Jekyll. It was generated when GH Pages was set to "create from branch:main" (and can be regenerated that way)

# The report is also locally generated, because it relies on a number of files with private information (names of participants). Thus, here, too
# we use a static ZIP, compiled on the PIs laptop.

jobs:
  unpack-website:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v3
  
      - name: Unpack Pages ZIP
        run: |
          unzip ./crress-github-pages.zip -d website
          cd website 
          tar xvf artifact.tar
          rm artifact.tar
          tar xzvf ../crress-outcomes-report.tgz
          [[ -d report ]] && rm -rf report
          mv _html report
      # Prepare the GitHub Pages action
      - name: prepare GitHub Pages action
        uses: actions/upload-pages-artifact@v3.0.1    
        with:
          path: ./website
  
  publish:
    needs: unpack-website
    if: ${{ github.event.inputs.refresh_website == 'true' || github.event_name == 'push' }}
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    # environment:
    #   name: github-pages
    #   url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 
  